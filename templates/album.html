{% extends "layout.html" %}

{% block title %}Album - Competitive Success Academy{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='album.css') }}"/>
{% endblock %}

{% block content %}

<section class="album-section">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title animate slide-up">School Album</h2>
      <p class="section-subtitle">Capturing moments of excellence and celebration</p>
    </div>

    <!-- Album Grid -->
    <div class="album-grid" id="albumGrid"></div>
  </div>
</section>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</button>
  <div class="lightbox-content">
    <img id="lightboxImg" src="" alt="">
    <p id="lightboxCaption" class="lightbox-caption"></p>
  </div>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const albumGrid = document.getElementById('albumGrid');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxCounter = document.getElementById('lightboxCounter');
  const closeBtn = document.getElementById('lightboxClose');
  const prevBtn = document.getElementById('lightboxPrev');
  const nextBtn = document.getElementById('lightboxNext');

  let images = [];
  let currentIndex = 0;

  // Fetch and render album
  fetch('/api/album')
    .then(res => res.json())
    .then(data => {
      if (!data || !Array.isArray(data.images)) {
        albumGrid.innerHTML = '<p class="no-images">No album images found</p>';
        return;
      }

      images = data.images;

      images.forEach((img, index) => {
        const card = document.createElement('div');
        card.className = 'album-card';
        card.style.animationDelay = `${index * 0.1}s`;

        card.innerHTML = `
          <div class="album-image-wrapper">
            <img src="${img.image}" alt="${img.caption}" loading="lazy">
            <div class="album-overlay">
              <span class="view-icon"></span>
            </div>
          </div>
          <div class="album-caption">${img.caption}</div>
        `;

        card.addEventListener('click', () => openLightbox(index));
        albumGrid.appendChild(card);
      });

      // Trigger animations
      setTimeout(() => {
        document.querySelectorAll('.album-card').forEach(card => {
          card.classList.add('loaded');
        });
      }, 100);
    })
    .catch(err => {
      console.error('Error loading album:', err);
      albumGrid.innerHTML = '<p class="no-images">Error loading album</p>';
    });

  // Lightbox functions
  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    lightbox.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('show');
    document.body.style.overflow = '';
  }

  function updateLightbox() {
    const img = images[currentIndex];
    lightboxImg.src = img.image;
    lightboxCaption.textContent = img.caption;
    lightboxCounter.textContent = `${currentIndex + 1} / ${images.length}`;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateLightbox();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateLightbox();
  }

  // Event listeners
  closeBtn.addEventListener('click', closeLightbox);
  nextBtn.addEventListener('click', nextImage);
  prevBtn.addEventListener('click', prevImage);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('show')) return;
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'Escape') closeLightbox();
  });
});
</script>

{% endblock %}
